<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Private Chat</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#8b5cf6" />
    <link rel="apple-touch-icon" href="icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-database-compat.js"></script>

    <style>
      :root {
        --bg: #0c0c0f;
        --surface: #16161a;
        --surface-2: #1e1e24;
        --border: #2a2a32;
        --text: #f4f4f5;
        --text-muted: #a1a1aa;
        --primary: #8b5cf6;
        --primary-hover: #7c3aed;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      #login-screen {
        width: 90%;
        max-width: 380px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 2.5rem 2rem;
        text-align: center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      #login-screen .logo {
        font-size: 2.2rem;
        margin-bottom: 0.6rem;
      }
      #login-screen h1 {
        font-size: 1.4rem;
        font-weight: 600;
        margin-bottom: 0.3rem;
      }
      #login-screen p {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 1.8rem;
      }

      .input-group {
        margin-bottom: 1rem;
        text-align: left;
      }
      .input-group label {
        display: block;
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 0.35rem;
      }

      input[type="email"],
      input[type="password"],
      input[type="text"] {
        width: 100%;
        padding: 0.95rem 1.1rem;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
      }

      input:focus {
        border-color: var(--primary);
      }

      #login-btn {
        width: 100%;
        padding: 0.95rem;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 0.5rem;
      }
      #login-btn:hover {
        background: var(--primary-hover);
      }
      #login-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      #error-msg {
        color: var(--danger);
        font-size: 0.85rem;
        margin-top: 1rem;
        display: none;
      }

      #chat-screen {
        display: none;
        width: 100%;
        max-width: 720px;
        height: 100dvh;
        background: var(--surface);
        flex-direction: column;
        overflow: hidden;
      }

      header {
        background: var(--surface-2);
        padding: 1rem 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      header .title h2 {
        font-size: 1.05rem;
        font-weight: 600;
      }
      header .status {
        font-size: 0.75rem;
        color: #4ade80;
        display: flex;
        align-items: center;
        gap: 0.3rem;
        margin-top: 2px;
      }
      header .status::before {
        content: "";
        width: 7px;
        height: 7px;
        background: #4ade80;
        border-radius: 50%;
      }

      .header-actions {
        display: flex;
        gap: 0.5rem;
      }

      .header-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-muted);
        padding: 0.4rem 0.85rem;
        border-radius: 8px;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.2s;
      }
      .header-btn:hover {
        background: var(--border);
        color: var(--text);
      }

      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
        scroll-behavior: smooth;
      }

      #messages::-webkit-scrollbar {
        width: 6px;
      }
      #messages::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      .message {
        max-width: 78%;
        padding: 0.75rem 1rem;
        border-radius: 16px;
        line-height: 1.45;
        word-wrap: break-word;
        animation: fadeIn 0.2s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.me {
        align-self: flex-end;
        background: var(--primary);
        color: white;
        border-bottom-right-radius: 5px;
      }

      .message.them {
        align-self: flex-start;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-bottom-left-radius: 5px;
      }

      .message .meta {
        font-size: 0.68rem;
        opacity: 0.7;
        margin-top: 0.3rem;
        text-align: right;
      }
      .message.them .meta {
        text-align: left;
      }

      #empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: var(--text-muted);
        text-align: center;
        padding: 2rem;
      }
      #empty-state .icon {
        font-size: 2.8rem;
        margin-bottom: 0.8rem;
        opacity: 0.5;
      }

      #input-area {
        padding: 1rem 1.25rem;
        background: var(--surface-2);
        border-top: 1px solid var(--border);
        display: flex;
        gap: 0.75rem;
        flex-shrink: 0;
      }

      #message-input {
        flex: 1;
        padding: 0.9rem 1.1rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        color: var(--text);
        font-size: 1rem;
        outline: none;
      }
      #message-input:focus {
        border-color: var(--primary);
      }

      #send-btn {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 14px;
        padding: 0 1.3rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      #send-btn:hover {
        background: var(--primary-hover);
      }
      #send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      @media (max-width: 600px) {
        #chat-screen {
          border-radius: 0;
        }
        .message {
          max-width: 85%;
        }
      }
    </style>
  </head>
  <body>
    <!-- LOGIN SCREEN -->
    <div id="login-screen">
      <div class="logo">🔒</div>
      <h1>velvet-verses9⚖️🦂</h1>
      <p>there's no one else</p>

      <div class="input-group">
        <label>Email</label>
        <input
          type="email"
          id="email-input"
          placeholder="mahal na mahal kita baby"
          autocomplete="email"
        />
      </div>

      <div class="input-group">
        <label>Password</label>
        <input
          type="password"
          id="password-input"
          placeholder="miss na miss kita baby"
          autocomplete="current-password"
        />
      </div>

      <button id="login-btn">Enter</button>
      <div id="error-msg"></div>
    </div>

    <!-- CHAT SCREEN -->
    <div id="chat-screen">
      <header>
        <div class="title">
          <h2>Just us</h2>
          <div class="status">Connected</div>
        </div>
        <div class="header-actions">
          <button class="header-btn" id="logout-btn">Logout</button>
        </div>
      </header>

      <div id="messages">
        <div id="empty-state">
          <div class="icon">💬</div>
          <p>No messages yet.<br />Say something nice.</p>
        </div>
      </div>

      <div id="input-area">
        <input
          type="text"
          id="message-input"
          placeholder="Type a message..."
          autocomplete="off"
        />
        <button id="send-btn">Send</button>
      </div>
    </div>

    <script>
      // Register Service Worker for PWA
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("./sw.js")
          .then(() => console.log("Service Worker registered"))
          .catch((err) => console.log("SW registration failed", err));
      }

      // ============================================
      // YOUR FIREBASE CONFIG
      // ============================================
      const firebaseConfig = {
        apiKey: "AIzaSyAABKYW9a2MuRtTy0-rql_sOJrrFFl5w7g",
        authDomain: "velvet-verses9.firebaseapp.com",
        databaseURL:
          "https://velvet-verses9-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "velvet-verses9",
        storageBucket: "velvet-verses9.firebasestorage.app",
        messagingSenderId: "498101486544",
        appId: "1:498101486544:web:1b3754fda6ef0810c0efd5",
      };

      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.database();

      // ELEMENTS
      const loginScreen = document.getElementById("login-screen");
      const chatScreen = document.getElementById("chat-screen");
      const emailInput = document.getElementById("email-input");
      const passwordInput = document.getElementById("password-input");
      const loginBtn = document.getElementById("login-btn");
      const errorMsg = document.getElementById("error-msg");
      const messagesDiv = document.getElementById("messages");
      const emptyState = document.getElementById("empty-state");
      const messageInput = document.getElementById("message-input");
      const sendBtn = document.getElementById("send-btn");
      const logoutBtn = document.getElementById("logout-btn");

      let mySide = localStorage.getItem("chat_side") || null;

      // LOGIN
      loginBtn.addEventListener("click", () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showError("Please enter email and password");
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = "Signing in...";

        auth
          .signInWithEmailAndPassword(email, password)
          .then(() => {})
          .catch((error) => {
            loginBtn.disabled = false;
            loginBtn.textContent = "Enter";
            showError("Wrong email or password");
            console.error(error);
          });
      });

      passwordInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") loginBtn.click();
      });

      function showError(text) {
        errorMsg.textContent = text;
        errorMsg.style.display = "block";
        setTimeout(() => (errorMsg.style.display = "none"), 3000);
      }

      // AUTH STATE
      auth.onAuthStateChanged((user) => {
        if (user) {
          loginScreen.style.display = "none";
          chatScreen.style.display = "flex";

          if (!mySide) {
            const choice = confirm(
              "Are you the person in Dubai?\n\nOK = Dubai side\nCancel = Manila side",
            );
            mySide = choice ? "dubai" : "manila";
            localStorage.setItem("chat_side", mySide);
          }

          startListeningToMessages();
          messageInput.focus();
        } else {
          chatScreen.style.display = "none";
          loginScreen.style.display = "block";
          emailInput.focus();
        }
      });

      // LOGOUT + CLEAR CREDENTIALS
      logoutBtn.addEventListener("click", () => {
        auth.signOut().then(() => {
          emailInput.value = "";
          passwordInput.value = "";
        });
      });

      // MESSAGES
      function startListeningToMessages() {
        const messagesRef = db.ref("messages");
        messagesDiv.innerHTML = "";
        messagesDiv.appendChild(emptyState);

        messagesRef.orderByChild("timestamp").on("child_added", (snapshot) => {
          const msg = snapshot.val();
          addMessageToUI(msg);
        });
      }

     function addMessageToUI(msg) {
        if (emptyState.parentNode) emptyState.remove();

        const div = document.createElement("div");
        const isMe = msg.side === mySide;
        div.className = `message ${isMe ? "me" : "them"}`;

        // Full date + time (example: Oct 2, 2:31 PM)
        const date = new Date(msg.timestamp);
        const timeString = date.toLocaleString([], {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });

        div.innerHTML = `
    ${escapeHtml(msg.text)}
    <div class="meta">${timeString}</div>
  `;

        messagesDiv.appendChild(div);
        scrollToBottom();

        // Play sound only for messages from the other person
        if (!isMe) {
          playNotificationSound();
        }
      }
      function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        sendBtn.disabled = true;

        const newMsg = {
          text: text,
          side: mySide,
          timestamp: Date.now(),
        };

        db.ref("messages")
          .push(newMsg)
          .then(() => {
            messageInput.value = "";
            sendBtn.disabled = false;
            messageInput.focus();
          })
          .catch((err) => {
            console.error(err);
            alert("Failed to send message");
            sendBtn.disabled = false;
          });
      }

      sendBtn.addEventListener("click", sendMessage);
      messageInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      function scrollToBottom() {
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      function playNotificationSound() {
        try {
          const audioCtx = new (
            window.AudioContext || window.webkitAudioContext
          )();
          const oscillator = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();

          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);

          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // soft high tone
          gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime); // volume

          oscillator.start();
          gainNode.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.4,
          );
          oscillator.stop(audioCtx.currentTime + 0.4);
        } catch (e) {
          console.log("Sound not supported");
        }
      }
    </script>
  </body>
</html>
